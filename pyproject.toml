[project]
name = "vocolore"
version = "0.1.0"
description = "Voice-to-coloring-page system for children"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "faster-whisper",
    "sounddevice",
    "numpy",
    "rich",
    "pynput",
    "soundfile",
    "python-dotenv",
    "requests",
    "Pillow",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.uv]
dev-dependencies = [
    "pytest",
]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
