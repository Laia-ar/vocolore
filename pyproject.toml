[project]
name = "vocolore"
version = "0.1.0"
description = "Voice-to-coloring-page system for children"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai-whisper",
    "torch",
    "torchaudio",
    "sounddevice",
    "numpy",
    "rich",
    "pynput",
    "soundfile",
    "python-dotenv",
    "requests",
    "Pillow",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

# Platform-specific PyTorch configuration
# For CUDA (Linux/Windows with NVIDIA GPU):
# uv pip install torch torchaudio --index-url https://download.pytorch.org/whl/cu118
# For MPS (macOS with Apple Silicon):
# uv pip install torch torchaudio
# For CPU only:
# uv pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
