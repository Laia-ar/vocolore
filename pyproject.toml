[project]
name = "vocolore"
version = "0.1.0"
description = "Voice-to-coloring-page system for children"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai-whisper",
    "torch",
    "torchaudio",
    "sounddevice",
    "numpy",
    "rich",
    "pynput",
    "soundfile",
    "python-dotenv",
    "requests",
    "Pillow",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu118" }
torchaudio = { index = "pytorch-cu118" }
